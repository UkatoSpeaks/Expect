name: pipeline

on:
  schedule:
    - cron: "0 6,18 * * *"   # twice daily, 06:00 and 18:00 UTC
  workflow_dispatch:       # manual: Actions tab -> pipeline -> Run workflow

permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Tests
        run: python -m pytest -q tests

      # Exit 1 = aborted (nothing written) or a prediction is about to be missed (everything
      # else written). Either way the job fails, and GitHub emails the user who last edited
      # the cron schedule above (Settings -> Notifications -> Actions must allow it).
      - name: Run pipeline
        id: pipeline
        run: python -m src.pipeline --summary-file "$RUNNER_TEMP/summary.txt"

      # Also after a failed pipeline step, so results and scores written before an alarm are
      # kept (an aborted run wrote nothing, so there is nothing to commit). The job still fails.
      - name: Commit and push changes
        if: ${{ !cancelled() && steps.pipeline.outcome != 'skipped' }}
        run: |
          git add -A -- predictions site_data data
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "pipeline: $(cat "$RUNNER_TEMP/summary.txt" 2>/dev/null || echo 'partial run')"
          git push
